<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatForge v2</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section id="dashboard">
      <header class="dash-head">
        <h1>BeatForge Projects</h1>
        <button id="newProjectBtn">New Project</button>
      </header>
      <div id="projectCards" class="cards"></div>
    </section>

    <section id="sequencerScreen" hidden>
      <header class="topbar">
        <div class="menu-left"><button>File</button><button>Project</button></div>
        <div class="head-right">
          <strong id="projectTitle">No Project</strong>
          <button id="saveBtn">Save</button>
          <button id="backBtn">Dashboard</button>
        </div>
      </header>

      <div class="tempo-row">
        <label>Subdivision
          <select id="subdivisionSelect">
            <option>1/4</option>
            <option>1/8</option>
            <option selected>1/16</option>
            <option>1/32</option>
          </select>
        </label>
        <label>BPM <input id="bpmInput" type="range" min="20" max="300" value="120" /></label>
      </div>

      <main>
        <h3>REC Rows</h3>
        <button id="addRecRowBtn">+ REC Row</button>
        <div id="recRows" class="rows"></div>

        <h3>Preset Drum Rack</h3>
        <button id="addPresetRowBtn">+ Preset Row</button>
        <div id="presetRows" class="rows"></div>
      </main>

      <footer class="transport">
        <button id="playBtn">PLAY</button>
        <button id="recordMasterBtn">RECORD MASTER</button>
        <span id="transportTimer">00:00</span>
        <button id="exportBtn">Export MP3</button>
      </footer>

      <pre id="statusLog"></pre>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
