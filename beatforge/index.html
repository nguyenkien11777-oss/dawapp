<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatForge v2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section id="dashboard">
      <header class="dash-head">
        <h1>BeatForge Projects</h1>
        <button id="newProjectBtn">New Project</button>
      </header>
      <div id="projectCards" class="cards"></div>
    </section>

    <section id="sequencerScreen" hidden>
      <header class="topbar">
        <div class="menu-left">
          <div class="menu"><button id="fileMenuBtn">File ▾</button><div id="fileMenu" class="dropdown" hidden>
            <button id="menuSave">Save</button><button id="menuSaveAs">Save As</button><button id="menuRename">Rename</button>
          </div></div>
          <div class="menu"><button id="optionMenuBtn">Option ▾</button><div id="optionMenu" class="dropdown" hidden>
            <div class="dropdown-title">Audio Tools</div>
            <button id="toolTrim">Trim</button><button id="toolNormalize">Normalize</button><button id="toolReverse">Reverse</button><button id="toolGain">Gain</button>
            <div class="dropdown-title">Music Player Settings</div>
            <label class="dropdown-label"><input id="musicSyncToggle" type="checkbox" /> Sync With Beat</label>
          </div></div>
        </div>
        <div class="head-right">
          <strong id="projectTitle">No Project</strong>
          <button id="backBtn">Dashboard</button>
        </div>
      </header>

      <div class="tempo-row">
        <label>BPM <input id="bpmInput" type="range" min="20" max="300" value="120" /></label>
        <label>Style
          <select id="bpmPresetSelect"></select>
        </label>
        <div class="bpm-value" id="bpmValue">120</div>
      </div>

      <main>
        <h3>REC Rows</h3>
        <button id="addRecRowBtn">+ REC Row</button>
        <div id="recRows" class="rows"></div>

        <h3>Preset Drum Rack</h3>
        <button id="addPresetRowBtn">+ Preset Row</button>
        <div id="presetRows" class="rows"></div>

        <section class="music-player">
          <h3>Music Player</h3>
          <div class="music-tools">
            <input id="musicFileInput" type="file" accept="audio/*" hidden />
            <button id="musicImportBtn">⏏ Import / Replace</button>
            <button id="musicRemoveBtn">🗑 Remove</button>
            <label><input id="musicEnabled" type="checkbox" /> Play Music</label>
          </div>
          <div class="vinyl-wrap">
            <div id="trackArc" class="track-arc">No track loaded</div>
            <div id="vinylDisc" class="vinyl-disc"></div>
          </div>
          <div class="music-controls">
            <label>Volume <input id="musicVolume" type="range" min="0" max="1" step="0.01" value="1" /></label>
            <label>Start Offset (s) <input id="musicStartOffset" type="number" min="0" step="0.1" value="0" /></label>
          </div>
        </section>
      </main>

      <footer class="transport">
        <button id="playBtn">PLAY</button>
        <button id="recordMasterBtn">RECORD MASTER</button>
        <span id="transportTimer">00:00</span>
      </footer>

      <pre id="statusLog"></pre>
    </section>

    <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal-box">
        <h4 id="modalTitle"></h4>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
